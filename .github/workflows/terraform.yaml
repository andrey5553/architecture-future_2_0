name: Terraform CI/CD

on:
  pull_request:
    branches: [main, master, dev, stage, prod]
    paths:
      - 'Task1Advanced/**'
  push:
    branches: [feat/work]
#    paths:
#      - 'Task1Advanced/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stage
          - prod
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TF_ROOT: "Task1Advanced"
  TF_VERSION: "1.8.0"

jobs:
  terraform:
    name: Terraform - ${{ github.ref_name }}
    runs-on: ubuntu-latest
    concurrency: 
      group: terraform-${{ github.ref_name }}
      cancel-in-progress: false

    defaults:
      run:
        shell: bash

    steps:
      - name: 🔹 Checkout repository
        uses: actions/checkout@v4

      - name: 🔹 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔹 Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.environment }}" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="${{ github.ref_name }}"
          fi
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "Working with environment: ${ENV}"

      # ──────────────────────────────────────────────────────────────
      # Set environment-specific variables
      # ──────────────────────────────────────────────────────────────
      - name: 🔹 Set variables for DEV
        if: steps.env.outputs.environment == 'dev'
        run: |
          echo "VM_NAME=yarch11-dev" >> $GITHUB_ENV
          echo "CORES=2" >> $GITHUB_ENV
          echo "MEMORY=2" >> $GITHUB_ENV
          echo "DISK_SIZE=10" >> $GITHUB_ENV
          echo "LABELS={\"env\":\"dev\",\"managed_by\":\"terraform\"}" >> $GITHUB_ENV

      - name: 🔹 Set variables for STAGE
        if: steps.env.outputs.environment == 'stage'
        run: |
          echo "VM_NAME=yarch11-stage" >> $GITHUB_ENV
          echo "CORES=4" >> $GITHUB_ENV
          echo "MEMORY=4" >> $GITHUB_ENV
          echo "DISK_SIZE=20" >> $GITHUB_ENV
          echo "LABELS={\"env\":\"stage\",\"managed_by\":\"terraform\"}" >> $GITHUB_ENV

      - name: 🔹 Set variables for PROD
        if: steps.env.outputs.environment == 'prod'
        run: |
          echo "VM_NAME=yarch11-prod" >> $GITHUB_ENV
          echo "CORES=4" >> $GITHUB_ENV
          echo "MEMORY=4" >> $GITHUB_ENV
          echo "DISK_SIZE=20" >> $GITHUB_ENV
          echo "LABELS={\"env\":\"prod\",\"managed_by\":\"terraform\"}" >> $GITHUB_ENV

      # ──────────────────────────────────────────────────────────────
      # Terraform steps
      # ──────────────────────────────────────────────────────────────

      - name: 🔹 Terraform Init
        working-directory: ${{ env.TF_ROOT }}/envs/${{ steps.env.outputs.environment }}
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_KEY }}

      - name: 🔹 Terraform Validate
        working-directory: ${{ env.TF_ROOT }}/envs/${{ steps.env.outputs.environment }}
        run: terraform validate

      - name: 🔹 Terraform Plan
        id: plan
        working-directory: ${{ env.TF_ROOT }}/envs/${{ steps.env.outputs.environment }}
        run: |
          terraform plan -no-color -out=tfplan \
            -var="vm_name=${{ env.VM_NAME }}" \
            -var="cores=${{ env.CORES }}" \
            -var="memory=${{ env.MEMORY }}" \
            -var="disk_size=${{ env.DISK_SIZE }}" \
            -var="labels=${{ env.LABELS }}" \
            -var="environment=${{ steps.env.outputs.environment }}" \
            2>&1 | tee plan_output.txt
        env:
          TF_VAR_yandex_token: ${{ secrets.YC_TOKEN }}
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_subnet_id: ${{ secrets.YC_SUBNET_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_KEY }}

      - name: 🔹 Save Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ steps.env.outputs.environment }}-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}/envs/${{ steps.env.outputs.environment }}/tfplan
          retention-days: 7

      - name: 🔹 Post plan summary
        run: |
          echo "## Terraform Plan Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          cat ${{ env.TF_ROOT }}/envs/${{ steps.env.outputs.environment }}/plan_output.txt | head -50 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ──────────────────────────────────────────────────────────────
      # Destroy (manual only)
      # ──────────────────────────────────────────────────────────────

      - name: 🔹 Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        working-directory: ${{ env.TF_ROOT }}/envs/${{ steps.env.outputs.environment }}
        run: terraform destroy -auto-approve -no-color
        env:
          TF_VAR_yandex_token: ${{ secrets.YC_TOKEN }}
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_vm_name: ${{ env.VM_NAME }}
          TF_VAR_cores: ${{ env.CORES }}
          TF_VAR_memory: ${{ env.MEMORY }}
          TF_VAR_disk_size: ${{ env.DISK_SIZE }}
          TF_VAR_labels: ${{ env.LABELS }}
          TF_VAR_subnet_id: ${{ secrets.YC_SUBNET_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_environment: ${{ steps.env.outputs.environment }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_KEY }}

      # ──────────────────────────────────────────────────────────────
      # Apply (specific conditions)
      # ──────────────────────────────────────────────────────────────

      - name: 🔹 Terraform Apply
        if: |
          (github.event_name == 'push' && contains(fromJson('["dev","stage"]'), github.ref_name)) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        working-directory: ${{ env.TF_ROOT }}/envs/${{ steps.env.outputs.environment }}
        run: terraform apply -no-color tfplan
        env:
          TF_VAR_yandex_token: ${{ secrets.YC_TOKEN }}
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_KEY }}

      - name: 🔹 Output instance info
        if: success() && (github.event_name == 'push' || github.event.inputs.action == 'apply')
        working-directory: ${{ env.TF_ROOT }}/envs/${{ steps.env.outputs.environment }}
        run: |
          echo "## 🚀 Deployment Info" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          terraform output >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          